name: Build and deploy

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [notes-updated]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout blog code
        uses: actions/checkout@v4

      - name: Clone notes content
        uses: actions/checkout@v4
        with:
          repository: tttrove/tttrove-vault
          token: ${{ secrets.NOTES_REPO_TOKEN }}
          path: content
          fetch-depth: 1

      - name: Clean notes metadata
        run: rm -rf content/.obsidian content/.github content/.gitignore content/.gitattributes

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Install Quartz plugins
        run: npx quartz plugin install

      - name: Build site
        run: npx quartz build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=tttrove-vault-blog --branch=main
